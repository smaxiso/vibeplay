<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e" />
      <stop offset="50%" stop-color="#16213e" />
      <stop offset="100%" stop-color="#0f3460" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  
  <!-- Dark Gradient Background (Matching Index Page) -->
  <rect width="100" height="100" rx="25" fill="url(#bg)" />
  
  <!-- Outer Cyan Glow -->
  <path d="M38 28 L38 72 L76 50 Z" fill="#3498DB" filter="url(#blur)" opacity="0.6" />
  
  <!-- Glassmorphic Play Button -->
  <path d="M38 28 L38 72 L76 50 Z" fill="url(#glass)" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" stroke-linejoin="round" />
</svg>
